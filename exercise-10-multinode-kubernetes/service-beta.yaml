apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-beta
  labels:
    app: service-beta
    exercise: "10"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-beta
  template:
    metadata:
      labels:
        app: service-beta
    spec:
      containers:
      - name: httpd
        image: httpd:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-beta-svc
  labels:
    exercise: "10"
spec:
  type: NodePort
  selector:
    app: service-beta
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30011
