apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flask-replicaset
  labels:
    app: flask-rs
    exercise: "03"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-rs
  template:
    metadata:
      labels:
        app: flask-rs
    spec:
      containers:
      - name: flask-app
        image: flask-rs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-rs-service
  labels:
    app: flask-rs
    exercise: "03"
spec:
  type: NodePort
  selector:
    app: flask-rs
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30003
