networks:
  monitoring:
    driver: bridge

services:
  flask-app:
    build: .
    container_name: ex06-flask
    ports:
      - "5006:5000"
    environment:
      APP_ENV: monitoring-demo
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: ex06-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
    depends_on:
      - flask-app

  grafana:
    image: grafana/grafana:latest
    container_name: ex06-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/flask_dashboard.json
      - ./grafana-dashboard-config.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
    networks:
      - monitoring
    depends_on:
      - prometheus
