#include <tunables/global>

profile flask-app-container flags=(attach_disconnected) {
  # Include base abstractions
  #include <abstractions/base>
  #include <abstractions/python>

  # Allow network access
  network inet tcp,
  network inet udp,

  # Allow reading from /proc (needed by many apps)
  /proc/*/status r,
  /proc/sys/kernel/ngroups_max r,

  # Allow the app directory read/write
  /app/** r,
  /app/*.py r,

  # Allow Python interpreter
  /usr/bin/python3* ix,
  /usr/local/bin/python3* ix,
  /usr/local/lib/python3*/** r,

  # Deny dangerous capabilities
  deny /bin/bash x,
  deny /bin/sh x,
  deny /usr/bin/apt* x,
  deny /usr/bin/curl x,
  deny /usr/bin/wget x,

  # Allow standard output/error/input
  /dev/null rw,
  /dev/tty rw,
  /dev/urandom r,
  /dev/random r,
}
